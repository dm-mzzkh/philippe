# Form for logging that a task was done. Writes one row into the `logs` table.
# See docs/form-schema.md (and docs/database.md) for the full reference.
name: log
title: Mark done
table: logs

# Columns filled from the Telegram message, not asked as fields:
#   logs.user_id   <- the sender's Telegram id
#   logs.user_name <- "@" + username (or full name)
context:
  - {column: user_id,   from: user_id}
  - {column: user_name, from: user_name}

fields:
  # Which task -> logs.task_id. Options are loaded from the tasks table
  # (active ones only); the button shows the title, the row stores the id.
  - key: task
    type: select
    label: What did you do?
    column: task_id
    allow_custom: false
    options:
      table: tasks
      value: id
      label: title
      where: active = true
      order_by: title

  # When -> logs.done_at. Relative-day buttons; Today is the default.
  - key: done_at
    type: date
    label: When?
    default: today

  # Optional note -> logs.comment. Type it or send a voice message; skippable.
  - key: comment
    type: text
    label: Any comment?
    required: false

# After the last field the bot shows the on_submit review automatically
# (Cancel / Submit & fill again). Not listed here.
