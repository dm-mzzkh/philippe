# Form for logging that a task was done. Writes one row into the `logs` table.
# See docs/form-schema.md for the full field-type reference.
name: log
title: Mark done
table: logs
fields:
  # Which task -> logs.task_id. Options are loaded from the tasks table
  # (only active ones); allow_custom is off so you can't log an unknown task.
  - key: task
    type: select
    label: What did you do?
    options: from tasks where active = true   # populated dynamically by the bot
    allow_custom: false

  # When -> logs.done_at. Relative-day buttons; Today is the default.
  - key: done_at
    type: date
    label: When?
    default: today

  # Optional note -> logs.comment. Type it or send a voice message; skippable.
  - key: comment
    type: text
    label: Any comment?
    required: false

# Not asked as fields — the bot fills these from the Telegram message context:
#   logs.user_id   <- message.from_user.id
#   logs.user_name <- "@" + message.from_user.username
#
# After the last field the bot shows the on_submit review automatically
# (parameter: value list, with Cancel / Submit & fill again). Not listed here.
