# Example form exercising every Philippe field type (a showcase, not tied to the
# home_cal DB — it has no `table`, so submitting just logs the record).
# See docs/form-schema.md for the full reference.

name: demo
title: Demo (all field types)

fields:
  # Short text — typed or sent as a voice message.
  - key: title
    type: title
    label: Task name

  # Long text — typed or sent as a voice message.
  - key: description
    type: text
    label: Describe the task
    required: false

  # One choice from a fixed set, with a default.
  - key: status
    type: select
    label: Status
    options: [todo, in_progress, done]
    default: todo
    allow_custom: false

  # Number with range validation and quick presets.
  - key: priority
    type: number
    label: Priority
    min: 1
    max: 5
    presets: [1, 3, 5]
    default: 3

  # Yes / No.
  - key: urgent
    type: bool
    label: Is it urgent?
    default: false

  # Relative-day buttons, or a typed date.
  - key: due
    type: date
    label: Due date
    default: today

  # Two-step recurrence: period, then frequency (1–365).
  - key: schedule
    type: repeat
    label: How often should it repeat?

  # Optional photo attachment.
  - key: cover
    type: photo
    label: Attach a cover image
    required: false

# After the last field the bot automatically shows the on_submit review
# (parameter: value list, with Cancel / Submit & fill again). Do not list it here.
