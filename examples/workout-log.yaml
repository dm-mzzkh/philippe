# Read-only VIEW: workouts grouped by date. Each row is one training day;
# exercises listed below the date. Needs a database.
name: workout-log
title: Дневник тренировок
kind: query
query: |
  SELECT
    to_char(workout_date, 'DD.MM') || E'\n' ||
    string_agg(
      exercise || ' · ' || sets || '×' || reps ||
      CASE WHEN weight IS NOT NULL
        THEN ' @ ' || to_char(weight, 'FM999990.##') || 'кг'
        ELSE '' END,
      E'\n' ORDER BY id
    ) AS label
  FROM workout_sets
  GROUP BY workout_date
  ORDER BY workout_date DESC
  LIMIT 10;
