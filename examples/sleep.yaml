# Record one night of sleep — writes a row into the `sleeps` table.
name: sleep
title: Записать сон
table: sleeps

context:
  - {column: user_id,   from: user_id}
  - {column: user_name, from: user_name}

fields:
  # Дата начала сна -> sleeps.sleep_date. По умолчанию вчера (логируем утром).
  - key: sleep_date
    type: date
    label: Дата начала сна
    default: yesterday

  # Начало сна -> sleeps.start_at (time, HH:MM).
  - key: start_at
    type: time
    label: Лёг

  # Конец сна -> sleeps.end_at. If it's <= start (crossed midnight) the view
  # adds 24h when computing the duration.
  - key: end_at
    type: time
    label: Встал

  # Комментарий по желанию -> sleeps.comment.
  - key: comment
    type: text
    label: Комментарий
    required: false
