services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot_dev
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_dev"]
      interval: 3s
      timeout: 3s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:latest
    ports:
      - "8081:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://bot:bot@db:5432/bot_dev?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
