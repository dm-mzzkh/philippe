[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "philippe"
version = "0.1.0"
description = "A Telegram bot that fills database records through guided form.yaml dialogs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "aiogram>=3.28.2",
]

[project.optional-dependencies]
telegram = ["aiogram>=3"]
db = ["psycopg[binary]>=3"]
# everything needed to actually run the bot against a database — `uv sync`
# extras are NOT additive, so install both at once via this combined extra.
bot = ["philippe[telegram,db]"]

[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
philippe = "philippe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
